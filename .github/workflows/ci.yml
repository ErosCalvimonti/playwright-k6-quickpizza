name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job tests its own QuickPizza container, never the shared public demo.
# Runners are pinned: ubuntu-latest moved to 26.04, which Playwright doesn't support yet.
env:
  BASE_URL: http://localhost:3333

jobs:
  playwright:
    name: Playwright (API + UI)
    runs-on: ubuntu-24.04
    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:latest
        ports:
          - 3333:3333
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Wait for QuickPizza
        run: timeout 60 bash -c 'until curl -sf $BASE_URL/ready; do sleep 2; done'

      - name: Run tests
        run: npm test

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  k6:
    name: k6 (smoke + load)
    runs-on: ubuntu-24.04
    needs: playwright
    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:latest
        ports:
          - 3333:3333
    steps:
      - uses: actions/checkout@v4

      - uses: grafana/setup-k6-action@v1

      - name: Wait for QuickPizza
        run: timeout 60 bash -c 'until curl -sf $BASE_URL/ready; do sleep 2; done'

      - run: mkdir -p k6/results

      - name: Smoke test
        run: k6 run k6/scenarios/smoke.ts

      - name: Load test (thresholds fail the build)
        run: k6 run k6/scenarios/load.ts
        env:
          VUS: 20

      - name: Upload k6 summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: k6/results/
          retention-days: 14
